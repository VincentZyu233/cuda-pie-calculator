name: Build and publish preview

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: preview-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[build-release]') ||
      contains(github.event.head_commit.message, '[build-action]') ||
      contains(github.event.head_commit.message, '[build release]') ||
      contains(github.event.head_commit.message, '[build action]')
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-22.04
            archive: cuda-pie-calculator-linux-amd64.tar.gz
          - name: windows-amd64
            runner: windows-2022
            archive: cuda-pie-calculator-windows-amd64.zip

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: 12.4.1
          method: network
          log-file-suffix: ${{ matrix.name }}.txt

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        shell: bash
        continue-on-error: true
        run: |
          cargo fmt --manifest-path tui/Cargo.toml -- --check

      - name: Configure and build engine on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Configure and build engine on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release --parallel

      - name: Build Rust TUI
        shell: bash
        run: |
          cargo build --release --manifest-path tui/Cargo.toml

      - name: Package on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cp build/bin/libcuda_pie_engine.so dist/
          cp tui/target/release/cuda-pie-calculator dist/
          tar -C dist -czf ${{ matrix.archive }} cuda-pie-calculator libcuda_pie_engine.so

      - name: Package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -LiteralPath build/bin/Release/cuda_pie_engine.dll -Destination dist/
          Copy-Item -LiteralPath tui/target/release/cuda-pie-calculator.exe -Destination dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.archive }}

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish-preview:
    name: Publish single preview release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Delete existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name' > previous-tags.txt
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            gh release delete "$tag" --yes --cleanup-tag
          done < previous-tags.txt

      - name: Create preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          tag="preview-${GITHUB_RUN_ID}-${short_sha}"
          gh release create "$tag" release-assets/* \
            --prerelease \
            --title "Preview ${short_sha}" \
            --notes "Automated CUDA build for commit ${GITHUB_SHA}."
